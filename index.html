<meta name="theme-color" content="#FAF9F7" id="meta-theme-color" />
<meta name="author" content="Amir Anwar" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="رفيق القرآن" />

<link rel="icon" type="image/png" href="assets/ui-image-1.png">
<link rel="apple-touch-icon" href="assets/logo-1.png">

<title>رفيق القرآن | Quran Companion</title>

<!-- Fonts: IBM Plex Sans Arabic (UI) + Reem Kufi (display) + Amiri Quran (Quran) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">

<!-- Modular CSS (spec section 3 — no single monolithic file) -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/quran.css">
<link rel="stylesheet" href="css/tajweed.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/audio.css">
<link rel="stylesheet" href="css/tasbeeh.css">
<link rel="stylesheet" href="css/adhkar.css">
<link rel="stylesheet" href="css/prayer-qibla.css">
<link rel="stylesheet" href="css/names.css">
<link rel="stylesheet" href="css/calendar-names.css">
<link rel="stylesheet" href="css/wird.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>

<!-- App loader (initial paint) -->
<div id="app-loader" aria-label="جاري تحضير التطبيق" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999;flex-direction:column;gap:18px">
  <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-emerald) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-quran);font-size:34px;font-weight:700;box-shadow:var(--shadow-primary)">ر ق</div>
  <div style="color:var(--fg-muted);font-size:14px;font-weight:500">جاري تحضير التطبيق</div>
  <div style="width:120px;height:3px;background:var(--bg-subtle);border-radius:999px;overflow:hidden">
    <div style="height:100%;width:40%;background:linear-gradient(90deg,var(--c-primary),var(--c-emerald));border-radius:inherit;animation:loader 1.4s ease-in-out infinite"></div>
  </div>
</div>
<style>
@keyframes loader {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
</style>

<div id="app"></div>
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- ES Module entry (spec section 3: modular architecture) -->
<script type="module" src="js/app.js"></script>

<!-- Service Worker registration (spec section 31, 66 — PWA offline) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('[SW] registered with scope:', reg.scope);
        // Check for updates every hour
        setInterval(() => reg.update(), 60 * 60 * 1000);
      }).catch((err) => console.warn('[SW] registration failed:', err));
    });
  }
</script>

<script>
  // Hide loader once module has had a chance to bootstrap
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 320);
      }
    }, 600);
  });
</script>

<!-- Legacy scripts are intentionally NOT loaded. They remain on disk as
     reference for incremental migration (spec section 2, 103).
     Old code: js/app-data.js, js/app-ui.js, js/quran-audio.js -->
</body>
</html>
